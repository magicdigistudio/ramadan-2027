<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ramadan 2027 Timetable · Auto-Fill · MagicDigiStudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--navy:#1E2A45;--gold:#C59B4B;--cream:#F8F2E7;--sand:#EFE4D0;--line:#E2D6BF;--muted:#8C8572;--fill:#F1E6CF}
*{box-sizing:border-box}
body{margin:0;font-family:Jost,Arial,sans-serif;color:var(--navy);background:#EDE6D8}
[dir=rtl] body,[dir=rtl] *{font-family:Amiri,Jost,serif;letter-spacing:0!important}
.panel{max-width:980px;margin:24px auto;background:var(--navy);color:var(--cream);border-radius:18px;padding:22px 26px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.panel h1{font-family:Marcellus,serif;font-weight:400;margin:0 0 4px;font-size:28px}
.panel p{margin:0 0 16px;opacity:.85;font-size:14px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:5px;font-weight:600}
input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #3B4A70;background:#26355A;color:#fff;font-size:15px;font-family:inherit}
.btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
button{border:0;border-radius:30px;padding:11px 22px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.go{background:var(--gold);color:var(--navy)} .pr{background:var(--cream);color:var(--navy)}
#msg{margin-top:12px;font-size:14px;min-height:20px;color:#F6D88B}
.sheet{width:8.5in;min-height:11in;margin:0 auto 40px;background:var(--cream);padding:.5in .55in;box-shadow:0 10px 30px rgba(0,0,0,.12);position:relative}
.sheet.a4{width:210mm;min-height:297mm}
.kick{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:600}
.sheet h2{font-family:Marcellus,serif;font-weight:400;font-size:28px;margin:4px 0 2px}
.sub{font-size:11px;color:var(--muted);font-style:italic;margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th{background:var(--navy);color:var(--cream);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;padding:6px 5px;font-weight:600}
td{border-bottom:1px solid var(--line);height:24px;font-size:12px;text-align:center;padding:0 5px}
td.t{font-family:Marcellus,serif;font-size:14px}
td.d{font-family:Marcellus,serif;color:var(--gold);font-size:13px}
tr.ten td{background:var(--fill)}
.circle{display:inline-block;width:12px;height:12px;border:1.3px solid var(--navy);border-radius:50%}
.note{font-size:9.5px;color:var(--muted);margin-top:8px;line-height:1.45}
.moon{position:absolute;top:.45in;inset-inline-end:.55in;width:46px;height:46px}
.foot{position:absolute;bottom:.3in;left:0;right:0;text-align:center;font-size:8px;letter-spacing:.25em;color:var(--muted);text-transform:uppercase}
@media print{
  body{background:#fff} .panel{display:none} .sheet{box-shadow:none;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media screen and (max-width:760px){.grid{grid-template-columns:1fr 1fr}.sheet{width:100%;min-height:auto;padding:16px}.sheet table th:nth-child(n+7),.sheet table td:nth-child(n+7){display:none}.sheet td.t{white-space:nowrap}.sheet td:nth-child(2){white-space:nowrap}.sheet h2{font-size:26px;padding-inline-end:52px}.sheet .moon{width:40px;height:40px;top:16px;inset-inline-end:16px}.sheet th,.sheet td{padding-left:3px;padding-right:3px}}
</style>
<style id="pagesize">@page{size:letter;margin:0}</style>
</head>
<body>

    <div><label data-t="country">Country</label><input id="country" placeholder="Germany"></div>
    <div><label data-t="method">Calculation method</label><select id="method"></select></div>
    <div><label data-t="sahur">Sahur ends at</label><select id="sahur"><option value="Fajr" data-t="fajr">Fajr</option><option value="Imsak" data-t="imsak">Imsak (≈10 min before Fajr)</option></select></div>

    <div><label data-t="fmt">Time format</label><select id="fmt"><option value="24">24h</option><option value="12">12h (AM/PM)</option></select></div>
    <div><label data-t="paper">Paper</label><select id="paper"><option value="letter">US Letter</option><option value="a4">A4</option></select></div>

  <div class="btns"><button class="go" id="go" data-t="create">Create my timetable</button><button class="pr" id="pr" data-t="print">Print / save as PDF</button></div>
  <div id="msg"></div>

const NAMES = {en:"English",de:"Deutsch",tr:"Türkçe",ar:"العربية",fr:"Français",ur:"اردو",id:"Bahasa Indonesia"};
const LOC = {en:"en-US",de:"de-DE",tr:"tr-TR",ar:"ar",fr:"fr-FR",ur:"ur-PK",id:"id-ID"};
const $ = id => document.getElementById(id);
let cur = "en";
function store(k, v){ try{ localStorage.setItem("rmd_" + k, v); }catch(e){} }
function load(k){ try{ return localStorage.getItem("rmd_" + k); }catch(e){ return null; } }

function applyLang(){
  const t = L[cur]; document.documentElement.lang = cur; document.documentElement.dir = (cur === "ar" || cur === "ur") ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el => { if (t[el.dataset.t]) el.textContent = t[el.dataset.t]; });
  store("lang", cur);
}
function init(){
  Object.entries(NAMES).forEach(([k, v]) => $("lang").add(new Option(v, k)));
  METHODS.forEach(([id, n]) => $("method").add(new Option(n, id)));
  const nav = (navigator.language || "en").slice(0, 2);
  cur = load("lang") || (L[nav] ? nav : "en"); $("lang").value = cur;
  ["city", "country", "method", "sahur", "fmt", "paper", "adj"].forEach(k => { const v = load(k); if (v !== null) $(k).value = v; });
  let fmtTouched = load("fmt") !== null;
  if (!fmtTouched) $("fmt").value = cur === "en" ? "12" : "24";
  $("fmt").onchange = () => { fmtTouched = true; };
  applyLang();
  $("lang").onchange = () => { cur = $("lang").value; if (!fmtTouched) $("fmt").value = cur === "en" ? "12" : "24"; applyLang(); if ($("out").innerHTML) $("go").click(); };
  $("country").onchange = () => { const m = BYCOUNTRY[$("country").value.trim().toLowerCase()]; if (m) $("method").value = m; };
  $("paper").onchange = () => { $("pagesize").textContent = `@page{size:${$("paper").value};margin:0}`; document.querySelectorAll(".sheet").forEach(s => s.classList.toggle("a4", $("paper").value === "a4")); };
  $("go").onclick = create; $("pr").onclick = () => window.print();
  $("paper").onchange();
}
function fmtTime(s){
  const hm = s.slice(0, 5); if ($("fmt").value === "24") return hm;
  let [h, m] = hm.split(":").map(Number); const ap = h < 12 ? "AM" : "PM"; h = h % 12 || 12; return `${h}:${String(m).padStart(2, "0")} ${ap}`;
}
async function create(){
  const t = L[cur], city = $("city").value.trim(), country = $("country").value.trim();
  if (!city || !country){ $("msg").textContent = t.need; return; }
  ["city", "country", "method", "sahur", "fmt", "paper", "adj"].forEach(k => store(k, $(k).value));
  $("msg").textContent = t.loading;
  try{
    const url = `https://api.aladhan.com/v1/hijriCalendarByAddress/1448/9?address=${encodeURIComponent(city + ", " + country)}&method=${$("method").value}&adjustment=${$("adj").value}`;
    const r = await fetch(url); const j = await r.json(); if (j.code !== 200 || !j.data || !j.data.length) throw new Error("bad");
    render(j.data, city, country); $("msg").textContent = "";
  }catch(e){ $("msg").textContent = t.err; }
}
function render(days, city, country){
  const t = L[cur], key = $("sahur").value, mname = $("method").selectedOptions[0].text;
  let rows = "";
  for (let i = 0; i < 30; i++){
    const d = days[i];
    if (d){
      const g = d.date.gregorian, dt = new Date(+g.year, g.month.number - 1, +g.day);
      const date = dt.toLocaleDateString(LOC[cur], {day: "numeric", month: "short"}), wd = dt.toLocaleDateString(LOC[cur], {weekday: "short"});
      rows += `<tr class="${i >= 20 ? "ten" : ""}"><td class="d">${i + 1}</td><td>${date}</td><td>${wd}</td><td class="t">${fmtTime(d.timings[key])}</td><td class="t">${fmtTime(d.timings.Maghrib)}</td><td><span class="circle"></span></td><td></td><td></td></tr>`;
    } else {
      rows += `<tr class="ten"><td class="d">30*</td><td></td><td></td><td></td><td></td><td><span class="circle"></span></td><td></td><td></td></tr>`;
    }
  }
  const a4 = $("paper").value === "a4" ? "a4" : "";
  $("out").innerHTML = `<div class="sheet ${a4}">
    <svg class="moon" viewBox="0 0 100 100"><path d="M62 8a44 44 0 1 0 30 70A36 36 0 1 1 62 8z" fill="#C59B4B"/><path d="M74 23 L77 31 L85 31 L79 36 L81 44 L74 39 L67 44 L69 36 L63 31 L71 31Z" fill="#C59B4B"/></svg>
    <div class="kick">${t.k}</div><h2>${t.h}</h2><div class="sub">${city}, ${country} · ${mname}</div>
    <table><tr><th>${t.day}</th><th>${t.date}</th><th>${t.wd}</th><th>${t.se}</th><th>${t.if}</th><th>${t.fa}</th><th style="width:22%">${t.host}</th><th style="width:22%">${t.inv}</th></tr>${rows}</table>
    <div class="note">${t.ten} · * ${t.d30}</div><div class="note">${t.note.replace("{m}", mname)}</div>
    <div class="foot">Ramadan 2027 · MagicDigiStudio</div></div>`;
}
init();
</script>
