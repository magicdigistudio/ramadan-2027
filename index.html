<style>
:root{--navy:#1E2A45;--gold:#C59B4B;--cream:#F8F2E7;--sand:#EFE4D0;--line:#E2D6BF;--muted:#8C8572;--fill:#F1E6CF}
*{box-sizing:border-box}
body{margin:0;font-family:Jost,Arial,sans-serif;color:var(--navy);background:#EDE6D8}
[dir=rtl] body,[dir=rtl] *{font-family:Amiri,Jost,serif;letter-spacing:0!important}
.panel{max-width:980px;margin:24px auto;background:var(--navy);color:var(--cream);border-radius:18px;padding:22px 26px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.panel h1{font-family:Marcellus,serif;font-weight:400;margin:0 0 4px;font-size:28px}
.panel p{margin:0 0 16px;opacity:.85;font-size:14px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:5px;font-weight:600}
input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #3B4A70;background:#26355A;color:#fff;font-size:15px;font-family:inherit}
.btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
button{border:0;border-radius:30px;padding:11px 22px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.go{background:var(--gold);color:var(--navy)} .pr{background:var(--cream);color:var(--navy)}
#msg{margin-top:12px;font-size:14px;min-height:20px;color:#F6D88B}
.sheet{width:8.5in;min-height:11in;margin:0 auto 40px;background:var(--cream);padding:.5in .55in;box-shadow:0 10px 30px rgba(0,0,0,.12);position:relative}
.sheet.a4{width:210mm;min-height:297mm}
.kick{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);font-weight:600}
.sheet h2{font-family:Marcellus,serif;font-weight:400;font-size:28px;margin:4px 0 2px}
.sub{font-size:11px;color:var(--muted);font-style:italic;margin-bottom:12px}
table{width:100%;border-collapse:collapse}
th{background:var(--navy);color:var(--cream);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;padding:6px 5px;font-weight:600}
td{border-bottom:1px solid var(--line);height:24px;font-size:12px;text-align:center;padding:0 5px}
td.t{font-family:Marcellus,serif;font-size:14px}
td.d{font-family:Marcellus,serif;color:var(--gold);font-size:13px}
tr.ten td{background:var(--fill)}
.circle{display:inline-block;width:12px;height:12px;border:1.3px solid var(--navy);border-radius:50%}
.note{font-size:9.5px;color:var(--muted);margin-top:8px;line-height:1.45}
.moon{position:absolute;top:.45in;inset-inline-end:.55in;width:46px;height:46px}
.foot{position:absolute;bottom:.3in;left:0;right:0;text-align:center;font-size:8px;letter-spacing:.25em;color:var(--muted);text-transform:uppercase}
.combo{position:relative}
.sug{position:absolute;z-index:30;inset-inline:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:#fff;color:var(--navy);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.35);max-height:320px;overflow-y:auto;-webkit-overflow-scrolling:touch;text-align:start}
.sug li{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1.3;min-height:44px;display:flex;flex-wrap:wrap;align-items:baseline;align-content:center;column-gap:6px;-webkit-tap-highlight-color:transparent}
.sug li small{color:var(--muted);font-size:12.5px}
.sug li[aria-selected=true],.sug li:hover{background:var(--fill)}
.sug li.none{color:var(--muted);cursor:default;font-size:14px}
input.ok{border-color:var(--gold)}
.fld{position:relative}
.fld input{padding-inline-end:40px}
.chev{position:absolute;top:0;bottom:0;inset-inline-end:0;width:42px;padding:0;border-radius:0 10px 10px 0;background:transparent;color:var(--gold);display:flex;align-items:center;justify-content:center}
[dir=rtl] .chev{border-radius:10px 0 0 10px}
.sug{overscroll-behavior:contain;width:auto;max-width:100%}
.sug li span{overflow-wrap:anywhere}
@media screen and (max-width:520px){.grid{grid-template-columns:1fr}.panel{margin:10px;padding:18px 16px}input,select{font-size:16px;padding:12px}.btns button{flex:1 1 100%;padding:14px 18px;font-size:16px}.sug{max-height:50vh}.sug li{font-size:16px;min-height:48px}}
@media print{
  body{background:#fff} .panel{display:none} .sheet{box-shadow:none;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media screen and (min-width:521px) and (max-width:760px){.grid{grid-template-columns:1fr 1fr}}

const NAMES = {en:"English",de:"Deutsch",tr:"Türkçe",ar:"العربية",fr:"Français",ur:"اردو",id:"Bahasa Indonesia"};
const LOC = {en:"en-US",de:"de-DE",tr:"tr-TR",ar:"ar",fr:"fr-FR",ur:"ur-PK",id:"id-ID"};
const $ = id => document.getElementById(id);
let cur = "en";
function store(k, v){ try{ localStorage.setItem("rmd_" + k, v); }catch(e){} }
function load(k){ try{ return localStorage.getItem("rmd_" + k); }catch(e){ return null; } }

function applyLang(){
  const t = L[cur]; document.documentElement.lang = cur; document.documentElement.dir = (cur === "ar" || cur === "ur") ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(el => { if (t[el.dataset.t]) el.textContent = t[el.dataset.t]; });
  $("country").placeholder = t.cph; $("city").placeholder = t.tph;
  store("lang", cur);
}
const esc = x => String(x).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fold = x => String(x).toLocaleLowerCase(LOC[cur]).normalize("NFD").replace(/[̀-ًͯ-ٰٟ]/g, "").replace(/ı/g, "i").replace(/[أإآ]/g, "ا");
let country = "", place = null, countries = [];   // country = ISO code, place = {name, lat, lon, tz, cc}

// ---------- country combobox ----------
function cname(code, lang){
  try{ const n = new Intl.DisplayNames([LOC[lang || cur], "en"], {type: "region", fallback: "none"}).of(code); if (n && n !== code) return n; }catch(e){}
  const f = CC.find(c => c[0] === code); return f ? f[1] : code;
}
function buildCountries(){
  countries = CC.map(([code, en]) => ({code, en, name: cname(code)}));
  const coll = new Intl.Collator(LOC[cur]);
  countries.sort((a, b) => coll.compare(a.name, b.name));
  countries.forEach(c => { c.key = fold(c.name) + " " + fold(c.en) + " " + c.code.toLowerCase(); });
  if (country) $("country").value = cname(country);
}
function setCountry(code, keepCity){
  const changed = code !== country; country = code || "";
  $("country").value = code ? cname(code) : ""; $("country").classList.toggle("ok", !!code); store("cc", country);
  if (code && !load("methodTouched")) $("method").value = BYCOUNTRY[code] || 3;   // default: Muslim World League
  if (changed && !keepCity && place && place.cc !== code){ place = null; $("city").value = ""; $("city").classList.remove("ok"); store("place", ""); store("city", ""); }
}
function combo(input, list, source, pick){
  let items = [], act = -1;
  const close = () => { list.hidden = true; input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-activedescendant"); act = -1; };
  const hilite = (i, center) => { act = i; [...list.children].forEach((li, k) => li.setAttribute("aria-selected", k === i ? "true" : "false"));
    const li = list.children[i]; if (li){ input.setAttribute("aria-activedescendant", li.id); list.scrollTop = center ? li.offsetTop - list.clientHeight / 2 + li.offsetHeight / 2 : (li.offsetTop < list.scrollTop ? li.offsetTop : (li.offsetTop + li.offsetHeight > list.scrollTop + list.clientHeight ? li.offsetTop + li.offsetHeight - list.clientHeight : list.scrollTop)); } };
  list.addEventListener("mousedown", e => e.preventDefault());
  document.addEventListener("pointerdown", e => { if (!list.hidden && !input.parentNode.closest(".combo").contains(e.target)) close(); }, true);
  const show = (arr, emptyMsg) => {
    items = arr; list.innerHTML = "";
    if (!arr.length){ if (!emptyMsg){ close(); return; } const li = document.createElement("li"); li.className = "none"; li.textContent = emptyMsg; list.appendChild(li); }
    arr.forEach((it, k) => { const li = document.createElement("li"); li.id = list.id + "-" + k; li.setAttribute("role", "option"); li.innerHTML = it.html;
      li.addEventListener("mousedown", e => e.preventDefault()); li.addEventListener("click", () => { pick(it); close(); }); list.appendChild(li); });
    list.hidden = false; input.setAttribute("aria-expanded", "true"); act = -1;
    const cur = arr.findIndex(it => it.current); if (cur >= 0) hilite(cur, true); else list.scrollTop = 0;
  };
  input.addEventListener("keydown", e => {
    if (list.hidden && (e.key === "ArrowDown")){ source(input.value, show, true); return; }
    if (e.key === "ArrowDown"){ e.preventDefault(); if (items.length) hilite(Math.min(act + 1, items.length - 1)); }
    else if (e.key === "ArrowUp"){ e.preventDefault(); if (items.length) hilite(Math.max(act - 1, 0)); }
    else if (e.key === "Enter"){ if (!list.hidden && items.length){ e.preventDefault(); pick(items[act >= 0 ? act : 0]); close(); } }
    else if (e.key === "Escape"){ close(); }
  });
  input.addEventListener("input", () => source(input.value, show, false));
  input.addEventListener("focus", () => { if (input === $("country")) { input.select(); source("", show, true); } });
  input.addEventListener("blur", () => setTimeout(close, 150));
  return {close, open: () => { input.focus(); source(input === $("country") ? "" : input.value, show, true); }, isOpen: () => !list.hidden};
}
function countrySource(q, show){
  const f = fold(q.trim());
  let arr = countries;
  if (f){
    const rank = c => { const n = fold(c.name), e = fold(c.en);
      if (n.startsWith(f) || e.startsWith(f) || c.code.toLowerCase() === f) return 0;
      if (c.key.split(/[\s,()\-]+/).some(w => w.startsWith(f))) return 1;
      return c.key.includes(f) ? 2 : 9; };
    arr = countries.map(c => [rank(c), c]).filter(x => x[0] < 9).sort((x, y) => x[0] - y[0]).map(x => x[1]).slice(0, 60);
  }
  show(arr.map(c => ({code: c.code, current: !f && c.code === country, html: esc(c.name)})), L[cur].none);
}

// ---------- city autocomplete (Open-Meteo geocoding, free, no key) ----------
let geoTimer = null, geoCtl = null;
const GEOLANG = {en: "en", de: "de", tr: "tr", ar: "ar", fr: "fr", ur: "ur", id: "id"};
function citySource(q, show){
  place = null; $("city").classList.remove("ok"); clearTimeout(geoTimer);
  const term = q.trim(); if (term.length < 2){ show([]); return; }
  geoTimer = setTimeout(async () => {
    if (geoCtl) geoCtl.abort(); geoCtl = new AbortController();
    try{
      let url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(term)}&count=${country ? 8 : 10}&language=${GEOLANG[cur]}&format=json`;
      if (country) url += `&countryCode=${country}`;   // server-side filter; also filtered below
      const r = await fetch(url, {signal: geoCtl.signal}); const j = await r.json();
      const RTLL = cur === "ar" || cur === "ur";
      const res = (j.results || []).filter(x => !country || x.country_code === country).filter(x => !x.feature_code || x.feature_code.startsWith("PPL"))
        .filter((x, k, a) => a.findIndex(y => y.name === x.name && y.admin1 === x.admin1 && y.country_code === x.country_code) === k).slice(0, 8);
      show(res.map(x => { const sub = [x.admin1 && x.admin1 !== x.name ? x.admin1 : "", country ? "" : cname(x.country_code)].filter(Boolean).join(RTLL ? "، " : ", ");
        return {name: x.name, lat: x.latitude, lon: x.longitude, tz: x.timezone, cc: x.country_code, sub,
                html: `<span>${esc(x.name)}${sub ? (RTLL ? "،" : ",") : ""}</span>${sub ? `<small>${esc(sub)}</small>` : ""}`}; }), L[cur].none);
      $("msg").textContent = "";
    }catch(e){ if (e.name !== "AbortError"){ show([]); if (!navigator.onLine) $("msg").textContent = L[cur].off; } }
  }, 250);
}
function pickCity(it){
  place = {name: it.name, lat: it.lat, lon: it.lon, tz: it.tz, cc: it.cc, sub: it.sub};
  $("city").value = it.name; $("city").classList.add("ok"); store("place", JSON.stringify(place));
  if (it.cc && it.cc !== country) setCountry(it.cc, true);
}

function init(){
  Object.entries(NAMES).forEach(([k, v]) => $("lang").add(new Option(v, k)));
  METHODS.forEach(([id, n]) => $("method").add(new Option(n, id)));
  const nav = (navigator.language || "en").slice(0, 2);
  cur = load("lang") || (L[nav] ? nav : "en"); $("lang").value = cur;
  ["city", "method", "sahur", "fmt", "paper", "adj"].forEach(k => { const v = load(k); if (v !== null) $(k).value = v; });
  try{ const pl = JSON.parse(load("place") || "null"); if (pl && pl.name === $("city").value){ place = pl; $("city").classList.add("ok"); } }catch(e){}
  let fmtTouched = load("fmt") !== null;
  if (!fmtTouched) $("fmt").value = cur === "en" ? "12" : "24";
  $("fmt").onchange = () => { fmtTouched = true; };
  $("method").addEventListener("change", () => store("methodTouched", "1"));
  applyLang(); buildCountries();
  let cc = load("cc");
  if (cc === null){ const m = (navigator.language || "").match(/[-_]([A-Za-z]{2})\b/); cc = m ? m[1].toUpperCase() : ""; }   // preselect by browser region
  if (cc && CC.some(c => c[0] === cc)) setCountry(cc, true);
  const cbox = combo($("country"), $("countrylist"), countrySource, it => { setCountry(it.code); if (!place) $("city").focus(); });
  $("cchev").addEventListener("mousedown", e => e.preventDefault());
  $("cchev").addEventListener("click", () => { if (cbox.isOpen()) cbox.close(); else { $("country").focus(); $("country").select(); cbox.open(); } });
  $("country").addEventListener("change", () => { const f = fold($("country").value.trim()); if (!f){ setCountry(""); return; }
    const hit = countries.find(c => fold(c.name) === f || fold(c.en) === f); if (hit) setCountry(hit.code); else if (country) $("country").value = cname(country); });
  combo($("city"), $("citylist"), citySource, pickCity);
  $("lang").onchange = () => { cur = $("lang").value; if (!fmtTouched) $("fmt").value = cur === "en" ? "12" : "24"; applyLang(); buildCountries(); if ($("out").innerHTML) $("go").click(); };
  $("paper").onchange = () => { $("pagesize").textContent = `@page{size:${$("paper").value};margin:0}`; document.querySelectorAll(".sheet").forEach(s => s.classList.toggle("a4", $("paper").value === "a4")); };
  $("go").onclick = create; $("pr").onclick = () => window.print();
  $("paper").onchange();
}
function fmtTime(s){
  const hm = s.slice(0, 5); if ($("fmt").value === "24") return hm;
  let [h, m] = hm.split(":").map(Number); const ap = h < 12 ? "AM" : "PM"; h = h % 12 || 12; return `${h}:${String(m).padStart(2, "0")} ${ap}`;
}
async function create(){
  const t = L[cur], city = $("city").value.trim();
  const usePlace = place && place.name === city;
  if (!city || (!usePlace && !country)){ $("msg").textContent = city ? t.needc : t.need; return; }
  ["city", "method", "sahur", "fmt", "paper", "adj"].forEach(k => store(k, $(k).value));
  $("msg").textContent = t.loading;
  const adj = +$("adj").value;   // AlAdhan applies `adjustment` only with calendarMethod=MATHEMATICAL (default HJCoSA ignores it)
  const q = `method=${$("method").value}` + (adj ? `&calendarMethod=MATHEMATICAL&adjustment=${adj}` : "");
  const url = usePlace
    ? `https://api.aladhan.com/v1/hijriCalendar/1448/9?latitude=${place.lat}&longitude=${place.lon}&${q}` + (place.tz ? `&timezonestring=${encodeURIComponent(place.tz)}` : "")
    : `https://api.aladhan.com/v1/hijriCalendarByAddress/1448/9?address=${encodeURIComponent(city + ", " + cname(country, "en"))}&${q}`;
  try{
    const r = await fetch(url); const j = await r.json(); if (j.code !== 200 || !j.data || !j.data.length) throw new Error("bad");
    render(j.data, city, country ? cname(country) : (usePlace ? cname(place.cc) : "")); $("msg").textContent = "";
  }catch(e){ $("msg").textContent = (!navigator.onLine || e instanceof TypeError) ? t.off : t.err; }
}
function render(days, city, country){
  const t = L[cur], key = $("sahur").value, mname = $("method").selectedOptions[0].text;
  let rows = "";
  for (let i = 0; i < 30; i++){
    const d = days[i];
    if (d){
      const g = d.date.gregorian, dt = new Date(+g.year, g.month.number - 1, +g.day);
      const date = dt.toLocaleDateString(LOC[cur], {day: "numeric", month: "short"}), wd = dt.toLocaleDateString(LOC[cur], {weekday: "short"});
      rows += `<tr class="${i >= 20 ? "ten" : ""}"><td class="d">${i + 1}${i === 29 ? "*" : ""}</td><td>${date}</td><td>${wd}</td><td class="t">${fmtTime(d.timings[key])}</td><td class="t">${fmtTime(d.timings.Maghrib)}</td><td><span class="circle"></span></td><td></td><td></td></tr>`;
    } else {
      rows += `<tr class="ten"><td class="d">30*</td><td></td><td></td><td></td><td></td><td><span class="circle"></span></td><td></td><td></td></tr>`;
    }
  }
  const a4 = $("paper").value === "a4" ? "a4" : "";
  $("out").innerHTML = `<div class="sheet ${a4}">
    <svg class="moon" viewBox="0 0 100 100"><path d="M62 8a44 44 0 1 0 30 70A36 36 0 1 1 62 8z" fill="#C59B4B"/><path d="M74 23 L77 31 L85 31 L79 36 L81 44 L74 39 L67 44 L69 36 L63 31 L71 31Z" fill="#C59B4B"/></svg>
    <div class="kick">${t.k}</div><h2>${t.h}</h2><div class="sub">${esc(city)}${country ? ((cur === "ar" || cur === "ur") ? "، " : ", ") + esc(country) : ""} · ${esc(mname)}</div>
    <table><tr><th>${t.day}</th><th>${t.date}</th><th>${t.wd}</th><th>${t.se}</th><th>${t.if}</th><th>${t.fa}</th><th style="width:22%">${t.host}</th><th style="width:22%">${t.inv}</th></tr>${rows}</table>
    <div class="note">${t.ten} · * ${t.d30}</div><div class="note">${t.note.replace("{m}", mname)}</div>
    <div class="foot">Ramadan 2027 · MagicDigiStudio</div></div>`;
}
init();
</script>
